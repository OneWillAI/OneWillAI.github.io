    const tree = document.getElementById("tree");
    const detail = document.getElementById("comparison-detail");
    const pairControls = document.getElementById("pair-controls");
    let activePair = "primary";
    let activeMode = "content";

    const el = (tag, className, text) => {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text !== undefined) node.textContent = text;
      return node;
    };

    const compactPath = (path) => String(path || "unknown")
      .replace(/^\/var\/lib\/onewill\/wally\/lower-home\/daytona-forking-coupon-demo\//, "")
      .replace(/^\/var\/lib\/onewill\/wally\/lower-home\//, "~/");

    function nodeCard(item, decision = false) {
      const card = el("article", `node${decision ? " decision" : ""}`);
      card.dataset.nodeId = item.id;
      const status = el("div", `status ${item.status}`, item.status);
      const title = el("div", "node-title", item.title);
      card.append(status, title);
      if (item.detail) card.append(el("div", "node-detail", item.detail));
      return card;
    }

    function stage(noteTitle, noteText, items, decision = false) {
      const section = el("section", "stage");
      const note = el("div", "stage-note");
      note.append(el("strong", "", noteTitle), document.createTextNode(noteText));
      const row = el("div", `node-row${items.length === 1 ? " single" : ""}`);
      row.style.setProperty("--columns", String(Math.min(items.length, 5)));
      items.forEach((item) => row.append(nodeCard(item, decision)));
      section.append(note, row);
      tree.append(section);
    }

    function renderTree() {
      document.getElementById("run-meta").textContent = DATA.model || "";
      if (DATA.status !== "passed" && !DATA.hypotheses.length) {
        const failure = el("div", "failure", DATA.error || "This trace ended before fork topology was recorded.");
        tree.append(failure);
        return;
      }
      stage("Prepared parent", "autosaved baseline", [DATA.parent]);
      stage("fork(parent)", "three sibling hypotheses", DATA.hypotheses);
      stage("aggregate", "model selects verified branch", [DATA.aggregation], true);
      stage("fork(selected hypothesis)", "two sibling refinements", DATA.refinements);
      stage("select refinement", "model picks common final parent", [DATA.selector], true);
      stage("fork(selected refinement)", "five sibling final fixes", DATA.finalLeaves);
      requestAnimationFrame(drawLineage);
    }

    function center(card, treeRect, edge) {
      const rect = card.getBoundingClientRect();
      return { x: rect.left - treeRect.left + rect.width / 2, y: edge === "top" ? rect.top - treeRect.top : rect.bottom - treeRect.top };
    }

    function addPath(svg, fromId, toId, selected) {
      const from = tree.querySelector(`[data-node-id="${CSS.escape(fromId)}"]`);
      const to = tree.querySelector(`[data-node-id="${CSS.escape(toId)}"]`);
      if (!from || !to) return;
      const rect = tree.getBoundingClientRect();
      const a = center(from, rect, "bottom");
      const b = center(to, rect, "top");
      const middle = (a.y + b.y) / 2;
      const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
      path.setAttribute("d", `M ${a.x} ${a.y} C ${a.x} ${middle}, ${b.x} ${middle}, ${b.x} ${b.y}`);
      if (selected) path.setAttribute("class", "selected");
      svg.append(path);
    }

    function drawLineage() {
      const svg = document.getElementById("lineage");
      if (!svg || !DATA.hypotheses.length) return;
      const rect = tree.getBoundingClientRect();
      svg.setAttribute("viewBox", `0 0 ${rect.width} ${rect.height}`);
      svg.replaceChildren();
      DATA.hypotheses.forEach((item) => addPath(svg, "parent", item.id, item.id === DATA.selected.hypothesis));
      if (DATA.selected.hypothesis) addPath(svg, DATA.selected.hypothesis, "aggregation", true);
      DATA.refinements.forEach((item) => addPath(svg, "aggregation", item.id, item.id === DATA.selected.refinement));
      if (DATA.selected.refinement) addPath(svg, DATA.selected.refinement, "selector", true);
      DATA.finalLeaves.forEach((item) => addPath(svg, "selector", item.id, item.id === DATA.selected.final));
      tree.querySelectorAll(".node").forEach((node) => {
        const id = node.dataset.nodeId;
        node.classList.toggle("selected-lineage", ["parent", DATA.selected.hypothesis, "aggregation", DATA.selected.refinement, "selector", DATA.selected.final].includes(id));
      });
    }

    function metric(value) { return el("span", "metric", value); }

    function renderContent(pair) {
      const diff = pair.contentDiff || {};
      const summary = diff.summary || {};
      const metrics = el("div", "metrics");
      metrics.append(
        metric(`${summary.added || 0} added`), metric(`${summary.removed || 0} removed`),
        metric(`${summary.modified || 0} modified`), metric(`${summary.typeChanged || 0} type changed`)
      );
      detail.append(metrics);
      const list = el("div", "change-list");
      (diff.changes || []).forEach((change) => {
        const box = el("details", "change");
        const summaryNode = el("summary", "");
        summaryNode.append(el("strong", "", `${change.status}: ${compactPath(change.path)}`), el("span", "change-meta", ` · ${change.type}`));
        box.append(summaryNode);
        box.append(el("pre", "", change.patch || "No textual patch was materialized for this change."));
        list.append(box);
      });
      detail.append(el("div", "section-title", "Path-level changes"));
      detail.append(list.childElementCount ? list : el("div", "empty", "No content changes recorded."));
    }

    function countTable(label, left, right) {
      const keys = [...new Set([...Object.keys(left || {}), ...Object.keys(right || {})])];
      keys.sort((a, b) => Math.abs((right[b] || 0) - (left[b] || 0)) - Math.abs((right[a] || 0) - (left[a] || 0)) || a.localeCompare(b));
      const block = el("section", "trajectory-block");
      block.append(el("h3", "", label));
      if (!keys.length) { block.append(el("div", "empty", "None recorded")); return block; }
      const wrap = el("div", "table-wrap");
      const table = document.createElement("table");
      const head = document.createElement("thead");
      head.innerHTML = "<tr><th>Target</th><th>Left</th><th>Right</th><th>Δ</th></tr>";
      const body = document.createElement("tbody");
      keys.forEach((key) => {
        const l = left[key] || 0;
        const r = right[key] || 0;
        const row = document.createElement("tr");
        [compactPath(key), String(l), String(r), `${r - l >= 0 ? "+" : ""}${r - l}`].forEach((value, index) => {
          const cell = document.createElement("td");
          cell.textContent = value;
          if (index === 3) cell.className = "delta";
          row.append(cell);
        });
        body.append(row);
      });
      table.append(head, body); wrap.append(table); block.append(wrap); return block;
    }

    function renderTrajectory(pair) {
      const diff = pair.trajectoryDiff || {};
      const left = diff.left || {};
      const right = diff.right || {};
      const metrics = el("div", "metrics");
      metrics.append(
        metric(`${left.steps || 0} → ${right.steps || 0} steps`),
        metric(`${left.checkpoints || 0} → ${right.checkpoints || 0} checkpoints`),
        metric(`${left.failures || 0} → ${right.failures || 0} failures`)
      );
      detail.append(
        metrics,
        countTable("Reads by path", left.reads || {}, right.reads || {}),
        countTable("Writes by path", left.writes || {}, right.writes || {}),
        countTable("Network destinations", left.network || {}, right.network || {}),
        countTable("Tools", left.tools || {}, right.tools || {})
      );
    }

    function highlightPair(pair) {
      tree.querySelectorAll(".node").forEach((node) => {
        const id = node.dataset.nodeId;
        node.classList.toggle("compare-left", id === pair.leftNode);
        node.classList.toggle("compare-right", id === pair.rightNode);
        node.classList.toggle("compare-dim", Boolean(pair.leftNode && pair.rightNode && id !== pair.leftNode && id !== pair.rightNode));
      });
    }

    function renderComparison() {
      const pair = DATA.pairs[activePair];
      const comparedTitle = (nodeId, fallback) => tree.querySelector(`[data-node-id="${CSS.escape(nodeId || "")}"] .node-title`)?.textContent || fallback;
      const setEndpoint = (id, role, nodeId, fallback) => {
        const endpoint = document.getElementById(id);
        endpoint.replaceChildren(
          el("span", "endpoint-role", role),
          el("span", "endpoint-title", comparedTitle(nodeId, fallback))
        );
      };
      setEndpoint("left-label", "Source", pair.leftNode, pair.leftLabel);
      setEndpoint("right-label", "Target", pair.rightNode, pair.rightLabel);
      detail.replaceChildren();
      if (activeMode === "content") renderContent(pair); else renderTrajectory(pair);
      highlightPair(pair);
      pairControls.querySelectorAll("button").forEach((button) => button.setAttribute("aria-pressed", String(button.dataset.pair === activePair)));
      document.querySelectorAll("[data-mode]").forEach((button) => button.setAttribute("aria-pressed", String(button.dataset.mode === activeMode)));
    }

    Object.entries(DATA.pairs).forEach(([name, pair]) => {
      const button = el("button", "btn", pair.label);
      button.type = "button"; button.dataset.pair = name; button.setAttribute("aria-pressed", String(name === activePair));
      button.addEventListener("click", () => { activePair = name; renderComparison(); });
      pairControls.append(button);
    });
    document.querySelectorAll("[data-mode]").forEach((button) => button.addEventListener("click", () => { activeMode = button.dataset.mode; renderComparison(); }));
    window.addEventListener("resize", () => requestAnimationFrame(drawLineage));
    renderTree();
    renderComparison();
  </script>
