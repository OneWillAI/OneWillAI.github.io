<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>OneWill | Will Meetup Waitlist</title>
    <script>
      (() => {
        const query = new URLSearchParams(window.location.search);
        query.set("metName", "Will");
        query.set("metEmail", "will@onewill.ai");
        window.location.replace(`/m/?${query.toString()}`);
      })();
    </script>
  </head>
  <body>
    <p>Redirecting to the meetup waitlist.</p>
  </body>
</html>
